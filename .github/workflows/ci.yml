name: BIG_O CI

on:
  push:
  pull_request:

permissions:
  contents: write

# Every push builds + tests. Every green push to main auto-bumps the MINOR version and cuts a non-prerelease GitHub
# Release. Runs are serialized per ref so concurrent pushes don't race on the next tag (DEADWEIGHT run 2, 2026-09-18);
# the tag is created server-side via `gh release create --target` because a plain `git push` of a tag from the runner is
# rejected by GITHUB_TOKEN when workflow files are in history.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
            if [ -z "$latest" ]; then major=0; minor=0; else
              ver="${latest#v}"; major="$(echo "$ver" | cut -d. -f1)"; minor="$(echo "$ver" | cut -d. -f2)"; fi
            tag="v${major}.$((minor + 1)).0"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  core:
    name: C core (ASan+UBSan tests, sim)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + test
        run: BIGO_VERSION=${{ needs.version.outputs.version }} scripts/build.sh
      - name: Bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf dist/bigo_rules_c.tar.gz core/witness_rules.c core/witness_rules.h core/runtime/parena_runtime.h tests/parity_vectors.txt docs/B1_WITNESS_RULES.md
          [ -f build/bigo_sim ] && cp build/bigo_sim dist/bigo_sim_linux_x86_64 || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ github.run_number }}
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows cross-build (mingw)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 file
      - name: Build
        run: BIGO_VERSION=${{ needs.version.outputs.version }} scripts/build.sh --windows
      - name: Collect
        run: |
          mkdir -p dist
          [ -f build/bigo_sim.exe ] && cp build/bigo_sim.exe dist/ || cp build/witness_rules_win.o dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.run_number }}
          path: dist/
          if-no-files-found: error

  client_linux:
    name: Game client (Linux, SDL2)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libgl-dev libglu1-mesa-dev
      - run: scripts/build_client.sh
      - name: Bundle
        run: |
          set -euo pipefail
          mkdir -p BIG_O_Linux
          cp build/bigo_client_linux build/mapeditor_linux BIG_O_Linux/
          printf '%s\n' '#!/usr/bin/env bash' 'exec "$(dirname "$0")/bigo_client_linux" "$@"' > BIG_O_Linux/PLAY.sh
          chmod +x BIG_O_Linux/*
      - uses: actions/upload-artifact@v4
        with:
          name: client-linux-${{ github.run_number }}
          path: BIG_O_Linux/
          if-no-files-found: error

  client_windows:
    name: Game client (Windows, mingw + bundled SDL2.dll)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip wget
      - name: Fetch SDL2 mingw devel package
        run: |
          set -euo pipefail
          wget -q --retry-connrefused --tries=3 https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-devel-2.30.10-mingw.tar.gz
          tar xzf SDL2-devel-2.30.10-mingw.tar.gz
          mv SDL2-2.30.10/x86_64-w64-mingw32 ./sdl2_mingw
      - run: scripts/build_client.sh --windows ./sdl2_mingw
      - name: Bundle
        run: |
          set -euo pipefail
          mkdir -p BIG_O_Windows
          cp build/bigo_client.exe build/mapeditor.exe sdl2_mingw/bin/SDL2.dll BIG_O_Windows/
          printf '%s\r\n' 'start bigo_client.exe' > BIG_O_Windows/PLAY.bat
          printf '%s\r\n' 'start mapeditor.exe' > BIG_O_Windows/EDIT_MAP.bat
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows-${{ github.run_number }}
          path: BIG_O_Windows/
          if-no-files-found: error

  release:
    name: Tag & Release
    needs: [version, core, windows, client_linux, client_windows]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir out
          cp artifacts/linux-*/* out/
          [ -f artifacts/windows-*/bigo_sim.exe ] && cp artifacts/windows-*/bigo_sim.exe out/ || true
          (cd artifacts/client-linux-* && tar -czf "$OLDPWD/out/bigo-linux-x86_64.tar.gz" .)
          (cd artifacts/client-windows-* && zip -qr "$OLDPWD/out/bigo-windows-x86_64.zip" .)
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
